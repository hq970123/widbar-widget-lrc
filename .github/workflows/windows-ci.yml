name: Windows CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runtime: win-x64
          - platform: ARM64
            runtime: win-arm64

    env:
      SOLUTION_PATH: templates/standalone/WidBarWidget1.sln
      CONFIGURATION: Release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: >-
          msbuild "$env:SOLUTION_PATH"
          /t:Restore
          /p:Configuration=$env:CONFIGURATION
          /p:Platform=${{ matrix.platform }}
          /p:RuntimeIdentifier=${{ matrix.runtime }}

      - name: Build
        run: >-
          msbuild "$env:SOLUTION_PATH"
          /m
          /p:Configuration=$env:CONFIGURATION
          /p:Platform=${{ matrix.platform }}
          /p:RuntimeIdentifier=${{ matrix.runtime }}
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageSigningEnabled=false
          /p:AppxBundle=Never

      - name: Stage artifacts
        shell: pwsh
        run: |
          $platform = "${{ matrix.platform }}"
          $artifactRoot = Join-Path $env:RUNNER_TEMP "widbar-widget-lrc-$platform"
          $msixDir = Join-Path $artifactRoot "msix"
          $sideloadDir = Join-Path $artifactRoot "sideload"
          New-Item -ItemType Directory -Path $msixDir -Force | Out-Null
          New-Item -ItemType Directory -Path $sideloadDir -Force | Out-Null

          $appPackages = "templates/standalone/WidBarWidget1 (Package)/AppPackages"
          if (Test-Path $appPackages) {
            Get-ChildItem -Path $appPackages -Recurse -Include *.msix,*.msixbundle,*.appx,*.appxbundle |
              ForEach-Object {
                Copy-Item $_.FullName -Destination $msixDir -Force
                Write-Host "Packaged: $($_.Name) ($([math]::Round($_.Length/1MB, 2)) MB)"
              }
          }

          # Loose layout for Developer Mode sideload (Add-AppxPackage -Register)
          $pkgBin = "templates/standalone/WidBarWidget1 (Package)/bin/$platform/$env:CONFIGURATION"
          if (Test-Path $pkgBin) {
            $layout = Get-ChildItem -Path $pkgBin -Directory -Recurse -Filter "AppxManifest.xml" |
              Select-Object -First 1
            if ($layout) {
              $layoutRoot = $layout.DirectoryName
              Copy-Item -Path "$layoutRoot\*" -Destination $sideloadDir -Recurse -Force
              Write-Host "Sideload layout from: $layoutRoot"
            }
          }

          # Fallback: copy AppPackages tree if no individual packages found
          if (-not (Get-ChildItem $msixDir -ErrorAction SilentlyContinue)) {
            if (Test-Path $appPackages) {
              Copy-Item -Path $appPackages -Destination (Join-Path $artifactRoot "AppPackages") -Recurse -Force
              Write-Host "Copied full AppPackages tree as fallback"
            }
          }

          Write-Host "--- Artifact tree ---"
          Get-ChildItem -Path $artifactRoot -Recurse -File |
            Select-Object @{N='Rel';E={$_.FullName.Substring($artifactRoot.Length+1)}}, @{N='MB';E={[math]::Round($_.Length/1MB,2)}} |
            Format-Table -AutoSize | Out-String | Write-Host

      - name: Create release ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $platform = "${{ matrix.platform }}"
          $artifactRoot = Join-Path $env:RUNNER_TEMP "widbar-widget-lrc-$platform"
          $zipPath = Join-Path $env:RUNNER_TEMP "widbar-widget-lrc-${{ github.ref_name }}-$platform.zip"
          Compress-Archive -Path "$artifactRoot\*" -DestinationPath $zipPath -Force
          Get-Item $zipPath | Select-Object FullName, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: widbar-widget-lrc-${{ matrix.platform }}
          path: ${{ runner.temp }}/widbar-widget-lrc-${{ matrix.platform }}
          if-no-files-found: error

      - name: Upload release ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: ${{ runner.temp }}/widbar-widget-lrc-${{ github.ref_name }}-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lah release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release-assets/*.zip
          --repo "${{ github.repository }}"
          --title "WidBar Lyrics ${{ github.ref_name }}"
          --generate-notes
          --verify-tag
